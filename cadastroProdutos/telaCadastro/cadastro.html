<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-soft: #eaf1ff;
            --secondary: #edf4ff;
            --text: #1f2937;
            --muted: #64748b;
            --success: #198754;
            --shadow: 0 18px 45px rgba(37, 99, 235, 0.18);
        }

        body {
            background: radial-gradient(circle at top, rgba(255,255,255,0.9), rgba(218, 231, 255, 0.95) 35%, #dfeaff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
        }

        .card {
            width: 100%;
            max-width: 520px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 22px;
            box-shadow: var(--shadow);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
        }

        h1 {
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        .form-label {
            color: var(--text);
            font-size: 0.92rem;
            margin-bottom: 0.5rem;
        }

        .form-control {
            border: 1.5px solid #dfe7ff;
            border-radius: 12px;
            padding: 0.8rem 0.9rem;
            background-color: #f8fbff;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.12);
            border-color: #9bbdff;
            background-color: #fff;
        }

        .btn {
            border-radius: 12px;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            border-color: var(--primary-dark);
        }

        .btn-secondary {
            background-color: var(--secondary);
            border-color: #dfeaff;
            color: #1e3a8a;
            font-weight: 600;
        }

        .btn-secondary:hover {
            background-color: #daeaff;
            border-color: #cfe1ff;
            color: #1e3a8a;
        }

        #mensagem {
            min-height: 24px;
            margin-top: 10px;
            font-weight: 700;
            color: var(--success);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card p-4 p-md-5 mx-auto">
            <h1 class="text-center text-primary mb-4">Cadastre seu Produto</h1>

            <form action="../cadastrarProduto/cadastrar.php" method="POST">
                <div class="mb-3">
                    <label for="nome" class="form-label fw-bold">Nome:</label>
                    <input type="text" class="form-control" name="nome" id="nome" placeholder="Nome do produto" required>
                </div>

                <div class="mb-3">
                    <label for="preco" class="form-label fw-bold">Preço:</label>
                    <input type="number" class="form-control" step="0.1" min="1" placeholder="R$0,00" name="preco" inputmode="numeric" id="preco" required>
                </div>

                <div class="mb-3">
                    <label for="quantidade" class="form-label fw-bold">Quantidade:</label>
                    <input type="number" class="form-control" inputmode="numeric" name="quantidade" id="quantidade" placeholder="Informe a quantidade" required>
                </div>

                <div class="mb-3">
                    <label for="categoria" class="form-label fw-bold">Categoria:</label>
                    <input type="text" class="form-control" name="categoria" id="categoria" placeholder="Informe a categoria" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">Cadastrar</button>
                <p id="mensagem"></p>

                <a href="../produtosCadastrados/index.php" class="btn btn-secondary w-100">Ver produtos cadastrados</a>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const parametros = new URLSearchParams(window.location.search);

        if (parametros.get('sucesso') === '1') {
            document.getElementById('mensagem').textContent = 'Produto cadastrado com sucesso!';
        }
    </script>
</body>
</html>
