<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhando formulários com imagens</title>
</head>
<body>
    
    <form action="imagem.php" method="post" enctype="multipart/form-data">

        <h1>Preencha o Formulário</h1>

        <label>Nome</label>
        <input type="text" name="nome" id="nome" placeholder="Informe seu nome" required>

        <label for="imagem">Escolha um arquivo</label>
        <input type="file" name="arquivo" id="arquivo" placeholder="Escolha um tipo de arquivo" required>

        <input type="submit" value="Cadastrar">

    </form>

</body>
</html>
