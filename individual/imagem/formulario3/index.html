<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Arquivo</title>
</head>
<body>
    
    <form action="salvarArquivo.php" method="POST" enctype="multipart/form-data">
        
        <h1>Cadastrar</h1>

        <label for="arquivo">Escolha um arquivo</label>
        <input type="file" name="arquivo" id="arquivo" 
        placeholder="Adicione um arquivo" required>
        
        <input type="submit" value="Cadastra Arquivo">
    </form>

</body>
</html>
