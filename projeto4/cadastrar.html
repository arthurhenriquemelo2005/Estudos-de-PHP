<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    
    <form action="autenticarCadastro.php" method="post">
        
        <h1>Cadastra-Se</h1>
        
        <label for="nome">Nome</label>
        <input type="text" name="nome" id="nome" required maxlength="25">

        <label for="telefone">Telefone</label>
        <input type="tel" name="telefone" id="telefone" required maxlength="20">

        <label for="email">E-mail</label>
        <input type="text" name="email" id="email" required maxlength="160">

        <label for="senha">Senha</label>
        <input type="password" name="senha" id="senha" required minlength="6">

        <label for="confirmar_senha">Confirmar Senha</label>
        <input type="password" name="confirmarSenha" id="confirmarSenha" required>

        <input type="submit" value="Cadastrar">
    </form>

</body>
</html>
