<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Doce Encanto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/estilo-doce.css">
</head>
<body>
    <div class="page-shell">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-6">
                    <div class="doce-card p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="doce-brand">Doce Encanto</div>
                            <h1 class="title-doce mb-1">Cadastre-se</h1>
                            <p class="text-doce-muted mb-0">Crie sua conta para pedir os melhores doces</p>
                        </div>

                        <form action="autenticarCadastro.php" method="post" class="row g-3">
                            <div class="col-12">
                                <label for="nome" class="form-label">Nome</label>
                                <input type="text" name="nome" id="nome" class="form-control" required maxlength="25">
                            </div>

                            <div class="col-12">
                                <label for="telefone" class="form-label">Telefone</label>
                                <input type="tel" name="telefone" id="telefone" class="form-control" required maxlength="20">
                            </div>

                            <div class="col-12">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="text" name="email" id="email" class="form-control" required maxlength="160">
                            </div>

                            <div class="col-12">
                                <label for="senha" class="form-label">Senha</label>
                                <input type="password" name="senha" id="senha" class="form-control" required minlength="6">
                            </div>

                            <div class="col-12">
                                <label for="confirmarSenha" class="form-label">Confirmar Senha</label>
                                <input type="password" name="confirmarSenha" id="confirmarSenha" class="form-control" required>
                            </div>

                            <div class="col-12">
                                <button type="submit" class="btn btn-doce-primary w-100">Cadastrar</button>
                            </div>
                        </form>

                        <div class="text-center mt-4">
                            <a href="login.html" class="link-doce">Já tem conta? Faça login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
