<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Doce Encanto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/estilo-doce.css">
</head>
<body>
    <div class="page-shell">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="doce-card p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="doce-brand-mark">🍰</div>
                            <div class="doce-brand">Doce Encanto</div>
                            <h1 class="title-doce mb-1">Login</h1>
                            <p class="text-doce-muted mb-0">Acesse sua conta para continuar</p>
                        </div>

                        <div id="mensagemErro" class="alert alert-doce d-none"></div>

                        <form action="autenticarLogin.php" method="POST" class="row g-3">
                            <div class="col-12">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" id="email" name="email" class="form-control" placeholder="Digite seu e-mail" required>
                            </div>

                            <div class="col-12">
                                <label for="senha" class="form-label">Senha</label>
                                <input type="password" id="senha" name="senha" class="form-control" placeholder="Digite sua senha" required>
                            </div>

                            <div class="col-12 mt-2">
                                <button type="submit" class="btn btn-doce-primary w-100">Entrar</button>
                            </div>
                        </form>

                        <div class="text-center mt-4">
                            <a href="cadastrar.html" class="link-doce">Ainda não tem conta? Cadastre-se</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const erro = params.get('erro');
        const areaErro = document.getElementById('mensagemErro');

        if (erro) {
            areaErro.textContent = decodeURIComponent(erro);
            areaErro.classList.remove('d-none');
        }
    </script>
</body>
</html>
