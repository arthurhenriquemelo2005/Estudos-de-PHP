<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Doce Encanto</title>

</head>
<body>
    <div class="login-box">
        <h1>Login</h1>

        <div id="mensagemErro" class="mensagem-erro"></div>

        <form action="autenticarLogin.php" method="POST">
            <div>
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            </div>

            <div>
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
            </div>

            <button type="submit">Entrar</button>
        </form>

        <div class="link-cadastro">
            <a href="cadastrar.html">Ainda não tem conta? Cadastre-se</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const erro = params.get('erro');
        const areaErro = document.getElementById('mensagemErro');

        if (erro) {
            areaErro.textContent = decodeURIComponent(erro);
            areaErro.style.display = 'block';
        }
    </script>
</body>
</html>
